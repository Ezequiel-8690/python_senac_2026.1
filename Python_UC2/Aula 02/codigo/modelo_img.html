<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title> Modelo de página HTML5 </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial-scale=1.0">
    <meta name="description" content="Uma página de exmplo para demostrar a estrutura básica do HTML5 com Booststrap e Font Awesome">
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        header { 
            border-color:darkred;
            border-width: 1px;
            border-style: solid ;
            padding-top: 20px;
            padding-bottom:20px;
        }
    </style>
    </head>
    <body>
    <section>
        <h1>Exemplo de uso de imagem </h1>
        <!--<img src="img/paisagem.jpg">-->
        <img src="img/paisagem.jpg"
        width="700px"
        height="700"
        alt="Por do sol - Praia Grande - Arraial do Cabo"
        title="Por do sol - Praia Grande - Arraial do Cabo"> 
        <!--Width altura-->
        <!--height largura-->
        <hr>
    </section>
    <section>
        <h4> 1ª Imagem </h4>
        <figure>
            <img src="img/christmas-6805045_1920.jpg" width="500"
            alt="Aqui tem uma foto">
            <figcaption> Figura 1: Imagem de natal </figcaption>
        </figure>
    </section>
    <hr>
    <section>
        <h4> 2ª Imagem </h4>
        <figure>
            <img src="img/bird-8450958_1920.png" height="600px"
            alt="Aqui tem uma foto">
            <figcaption> Figura 2: Imagem de um passaro </figcaption>
        </figure>
    </section>
    <hr>
    <section>
        <h4> 3ª Imagem </h4>
        <figure>
            <img src="img/bouquet-8627534_1920.jpg" width="800px"
            alt="Aqui tem uma foto">
            <figcaption> Figura 3: Imagem de flores </figcaption>
        </figure>
    </section>
    <hr>
    <section>
        <h4> 4ª Imagem </h4>
        <figure>
            <img src="img/field-1728099_1920.jpg" width="700px"
            alt="Aqui tem uma foto">
            <figcaption> Figura 4: Imagem de um vale </figcaption>
        </figure>
    </section>
    <hr>
    <section>
        <h4> 5ª Imagem </h4>
        <figure>
            <!--Se a pasta estiver fora do arquivo de imagem, tem que chamar ela dentro do cód-->
            <img src="img/mountains-3324569_1920.jpg" height="600px"
            alt="Aqui tem uma foto">
            <figcaption> Figura 5: Imagem de montanhas </figcaption>
        </figure>
    </section>
    <hr>
</body>

    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"> </script>
</html>
